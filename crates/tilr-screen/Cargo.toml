[package]
name = "tilr-screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Terminal screen model for tilrd: a VT engine (libghostty-vt) behind a backend-neutral trait that produces frames"
readme = "../../README.md"
keywords = ["terminal", "vt", "ghostty", "emulator", "tilr"]
categories = ["command-line-interface", "text-processing"]

[dependencies]
tilr-proto.workspace = true
anyhow.workspace = true
# kitty-graphics: image storage and placements; png: its PNG decoder, and our encoder for the frame.
libghostty-vt = { version = "=0.2.2", default-features = false, features = ["kitty-graphics", "png"] }
png = "0.18"
