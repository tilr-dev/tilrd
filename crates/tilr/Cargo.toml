[package]
name = "tilr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Terminal client of tilrd: attach to its panes from a terminal, tmux-style"
readme = "../../README.md"
keywords = ["terminal", "client", "tmux", "pty", "tilr"]
categories = ["command-line-utilities"]

[dependencies]
tilr-websocket.workspace = true
tilr-proto.workspace = true
anyhow.workspace = true
base64 = "0.23"
bytes.workspace = true
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "signal"] }
tokio-tungstenite = "0.30"
toml = "1.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }

