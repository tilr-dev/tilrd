[package]
name = "tilr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal client of tilrd: attach to its panes from a terminal, tmux-style"

[dependencies]
tilr-proto.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "signal"] }
tokio-tungstenite = "0.28"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

