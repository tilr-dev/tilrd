syntax = "proto3";

package tilr.v1;

// Both sides ignore message types and fields they do not know.
//
// PROTOCOL_VERSION (Hello / HelloAck `protocol_version`, now 3) is the
// mandatory contract: a peer of a version implements every message and field
// of it, and a server refuses every other version. A change a peer cannot
// ignore (a request a client relies on, a changed meaning, a new close code)
// bumps the version. A change a peer may ignore (a new push, a new field with
// a harmless default) needs neither a bump nor a feature. HelloAck `features`
// names only capabilities a server can be run without (switched off by its
// operator or missing in its environment), so a client checks one before
// sending that capability's requests; Hello `features` says what the client
// can serve.

// ---------------------------------------------------------------------------
// Client -> server
// ---------------------------------------------------------------------------

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    CreatePane create_pane = 2;
    ClosePane close_pane = 3;
    ListPanes list_panes = 4;
    Subscribe subscribe = 5;
    Unsubscribe unsubscribe = 6;
    Resize resize = 7;
    KeyInput key = 8;
    MouseInput mouse = 9;
    Paste paste = 10;
    RawInput raw = 11;
    Scroll scroll = 12;
    ClipboardPut clipboard_put = 13;
    Ping ping = 14;
    FsList fs_list = 15;
    FsStat fs_stat = 16;
    FsRead fs_read = 17;
    FsWrite fs_write = 18;
    FsMkdir fs_mkdir = 19;
    FsRename fs_rename = 20;
    FsDelete fs_delete = 21;
    FsWatch fs_watch = 22;
    FsUnwatch fs_unwatch = 23;
    StreamData stream_data = 24;
    StreamClose stream_close = 25;
    ExecStart exec_start = 26;
    ExecInput exec_input = 27;
    ExecSignal exec_signal = 28;
    ExecCancel exec_cancel = 29;
  }
  // Names an input message (KeyInput, MouseInput, Paste, RawInput, Scroll, Resize) so the
  // client can tell which frame shows its effect: HelloAck.seq_base + n, n = 1, 2, 3, ...
  // counted by the client on its connection; echoed in Frame.last_input_seq. 0 = not named.
  // Optional; a server that does not know the field ignores it.
  uint64 seq = 100;
}

// Must be the first message on a connection. The server answers HelloAck, or,
// if it does not speak `protocol_version`, an Error and closes the
// connection. Anything sent before Hello gets the same refusal.
message Hello {
  // The PROTOCOL_VERSION the client was built against.
  uint32 protocol_version = 1;
  string client_name = 2;
  // Optional capabilities the client supports:
  //   "host-events" - takes HostEvent
  //   "agent" - serves the SSH agent (StreamOpen with kind "ssh-agent")
  //   "clipboard-write" - takes ClipboardWrite
  repeated string features = 3;
  // The server's access token (`tilr token` on its machine). A server that asks for
  // one answers a Hello without it, or with another, with an Error and
  // closes the connection.
  string token = 4;
  // Names this client instance (a window, a tab, a process) for as long as it
  // runs, the same on every connection it makes: a UUID v4 in its text form,
  // made up by the client when it starts. A Hello that names the client_id of
  // a connection still open with the same token closes that connection at
  // once, with the WebSocket close code CLOSE_SUPERSEDED: it is the same
  // client come back on a new connection, and the old one is what a network
  // it left still holds. Nothing carries over to the new connection; it
  // subscribes as any other. A client whose connection is closed as
  // superseded does not reconnect it. Empty = no identity: such a connection
  // supersedes nobody and nobody supersedes it.
  string client_id = 5;
}

// WebSocket close codes the server ends a connection with, besides the
// standard ones (see `tilr_proto::close`):
//   4000 "superseded" - a newer connection of the same client (Hello.client_id)
//   4001 "too slow"   - the client did not take what it was sent
//   4002 "timeout"    - the client went silent, or stopped answering the
//                       server's WebSocket pings (it no longer hears it)
//
// A client answers the server's WebSocket pings, as browsers and WebSocket
// libraries do on their own, in the order it reads. Besides telling the
// client is there, they pace data in quantity (FsData, StreamData,
// ExecOutput): the server keeps at most about 1 MiB of it written but not
// yet read by the client, which it knows by the pongs to pings it sends
// between the chunks, so that a frame never waits behind megabytes of file
// in the network. A client that does not answer pings stalls its file
// reads, streams and execs.

// Panes are named by `pane_id`: a UUID in its usual text form
// ("6f1c2a9e-3b7d-4c1f-9a52-0e8d7b61c3f4") that the server makes up when the
// pane is created. It names that pane and no other, on this server or any
// other, before or after a restart.

message CreatePane {
  uint32 cols = 1;
  uint32 rows = 2;
  // Empty = the user's login shell.
  repeated string command = 3;
  // Directory to start in. Empty, or not a directory on the server's machine
  // = the home directory.
  string cwd = 4;
  // Echoed back in PaneCreated so the client can match the reply.
  uint64 request_id = 5;
}

message ClosePane {
  string pane_id = 1;
}

message ListPanes {
  // Echoed back in the PaneList reply.
  uint64 request_id = 1;
}

// Start receiving frames for a pane. The first frame after this is full.
message Subscribe {
  string pane_id = 1;
}

message Unsubscribe {
  string pane_id = 1;
}

message Resize {
  string pane_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  // The client's cell in pixels: image placements are measured in it, and programs that ask
  // for the screen size in pixels get it. 0 = keep what the pane has (10x20 to begin with).
  uint32 cell_width_px = 4;
  uint32 cell_height_px = 5;
}

enum KeyAction {
  KEY_ACTION_PRESS = 0;
  KEY_ACTION_RELEASE = 1;
  KEY_ACTION_REPEAT = 2;
}

enum NamedKey {
  NAMED_KEY_UNSPECIFIED = 0;
  NAMED_KEY_ENTER = 1;
  NAMED_KEY_TAB = 2;
  NAMED_KEY_BACKSPACE = 3;
  NAMED_KEY_ESCAPE = 4;
  NAMED_KEY_SPACE = 5;
  NAMED_KEY_UP = 6;
  NAMED_KEY_DOWN = 7;
  NAMED_KEY_LEFT = 8;
  NAMED_KEY_RIGHT = 9;
  NAMED_KEY_HOME = 10;
  NAMED_KEY_END = 11;
  NAMED_KEY_PAGE_UP = 12;
  NAMED_KEY_PAGE_DOWN = 13;
  NAMED_KEY_INSERT = 14;
  NAMED_KEY_DELETE = 15;
  NAMED_KEY_F1 = 16;
  NAMED_KEY_F2 = 17;
  NAMED_KEY_F3 = 18;
  NAMED_KEY_F4 = 19;
  NAMED_KEY_F5 = 20;
  NAMED_KEY_F6 = 21;
  NAMED_KEY_F7 = 22;
  NAMED_KEY_F8 = 23;
  NAMED_KEY_F9 = 24;
  NAMED_KEY_F10 = 25;
  NAMED_KEY_F11 = 26;
  NAMED_KEY_F12 = 27;
}

// Modifier bitmask shared by key and mouse input.
//   1 = shift, 2 = alt, 4 = ctrl, 8 = super
message KeyInput {
  string pane_id = 1;
  KeyAction action = 2;
  uint32 mods = 3;
  // Exactly one of `named` / `codepoint` identifies the key. `codepoint` is
  // the unshifted character of the key ('a' for Shift+A).
  NamedKey named = 4;
  uint32 codepoint = 5;
  // Text the key produced, if any ("A" for Shift+A).
  string text = 6;
  // The physical key, as W3C KeyboardEvent.code names it: "KeyC", "Digit1",
  // "BracketLeft", "Semicolon", ... (the name of the key at that place on a
  // US keyboard, whatever the layout). A browser has it as event.code; on
  // macOS it comes from NSEvent.keyCode (kVK_ANSI_C -> "KeyC"), on iPad from
  // UIKey.keyCode (the HID usage, UIKeyboardHIDUsageKeyboardC -> "KeyC").
  //
  // It matters with Ctrl on a layout that is not Latin: Ctrl+C on a Russian
  // layout is the key that types "с" (U+0441), and a terminal sends ^C for
  // it, as for Ctrl+C on a US layout. So when Ctrl is held and the key's
  // character (`codepoint`, or `text`) is not ASCII, the server encodes the
  // key as its US-layout character: Ctrl+С is 0x03, Ctrl+Я is 0x1A (the Z
  // key), Ctrl+Alt+С is ESC 0x03. A character that is ASCII is taken as it
  // is, whatever the physical key: Ctrl+C on Dvorak (the I key) is 0x03,
  // Ctrl+A on AZERTY (the Q key) is 0x01. Alt without Ctrl is ESC and the
  // character the key produced (`text`, else `codepoint` with Shift), never
  // remapped: Alt+ж is ESC ж, Alt+Shift+Ф is ESC Ф. A character composed by
  // AltGr or macOS Option is sent without Alt and passes as itself; Alt is
  // only what `mods` says (Option acting as Alt is the client's setting).
  // With the kitty keyboard protocol the physical key is also the "base
  // layout key" it reports. Typing without Ctrl or Alt is the text, as ever.
  //
  // Empty: no physical key (synthetic input from a script, or a character
  // key of a client that reads keys as characters, such as `tilr`); the key
  // is then taken from `codepoint` as if the layout were US, and Ctrl with a
  // character that is not ASCII sends nothing (Alt: ESC and the character).
  string code = 7;
}

enum MouseAction {
  MOUSE_ACTION_PRESS = 0;
  MOUSE_ACTION_RELEASE = 1;
  MOUSE_ACTION_MOTION = 2;
}

enum MouseButton {
  MOUSE_BUTTON_NONE = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
  MOUSE_BUTTON_WHEEL_UP = 4;
  MOUSE_BUTTON_WHEEL_DOWN = 5;
}

message MouseInput {
  string pane_id = 1;
  MouseAction action = 2;
  MouseButton button = 3;
  uint32 mods = 4;
  // Cell coordinates inside the pane, zero-based.
  uint32 x = 5;
  uint32 y = 6;
}

message Paste {
  string pane_id = 1;
  string text = 2;
}

// Bytes written to the pty as-is, for scripts and automation.
message RawInput {
  string pane_id = 1;
  bytes data = 2;
}

// Move the scrollback viewport. Negative = up (into history).
message Scroll {
  string pane_id = 1;
  sint32 delta = 2;
  // Jump back to the live bottom; `delta` is ignored.
  bool to_bottom = 3;
}

// Replace the server's clipboard, the one programs in every pane read
// through the `xclip` and `wl-paste` the server puts on their PATH. Requires
// the "clipboard" feature.
//
// Content goes up in chunks sharing one `transfer_id`. The first chunk empties
// the clipboard; the content becomes readable once the chunk with `last`
// arrived, and ClipboardAck follows. Messages sent after the last chunk (the
// paste keystroke, say) are handled after it, so a client need not wait for
// the ack.
message ClipboardPut {
  // Chosen by the client, distinct from its previous transfer.
  uint64 transfer_id = 1;
  // MIME type of the content, e.g. "image/png". First chunk only.
  string mime = 2;
  // Size of the whole content in bytes. First chunk only. The server refuses
  // more than HelloAck.clipboard_max_bytes.
  uint64 total_size = 3;
  bytes data = 4;
  bool last = 5;
}

// Ask whether the server is still there; it answers Pong at once. Every
// server has it: no feature announces it.
//
// A network that drops out without closing the connection leaves a client
// waiting forever. A client that pings and hears nothing back for a while
// knows to reconnect. (The server checks on its clients with WebSocket pings,
// which a browser answers by itself but does not let a page send. A client
// that sends but no longer answers them, its way from the server cut, is
// dropped like one that went silent: Ping does not keep a connection alive.)
message Ping {
  // Echoed back in the Pong.
  uint64 nonce = 1;
}

// ---------------------------------------------------------------------------
// Files: the server machine's file system, for a file browser and an editor.
// Requires the "files" feature.
//
// Every request carries a `request_id` the client chooses, echoed back in the
// answer (FsEntries, FsInfo, FsData, FsAck). An answer whose `error` is set
// tells why the request failed, meant to be shown to the user; the general
// Error message is not used, so the client knows which request it is about.
//
// Paths are absolute on the server's machine; "~" and "~/..." are the home
// directory of the user the server runs as. The server only goes inside the
// directories it is configured with (`[files] roots`, the home directory by
// default): a path that leads elsewhere, through ".." or a symbolic link,
// gets an error. A server that is read-only (`[files] readonly`) answers
// FsWrite, FsMkdir, FsRename and FsDelete with an error.
//
// Names that are not UTF-8. A file name on Linux is any bytes but '/' and
// NUL, which a `string` cannot hold. Every path in a request has a `bytes`
// twin (`path_bytes`, `from_bytes`, `to_bytes`): the path as the raw bytes
// of the server's file system. When it is not empty the server goes by it
// and ignores the string, which is then only for showing. In answers, a
// name or path that is not UTF-8 comes with its raw bytes the same way
// (FsEntry.name_bytes, FsEntries/FsInfo/FsChanged.path_bytes), its string
// then being the bytes made UTF-8 with U+FFFD for what is not, for showing
// only. A client sends back the bytes of what it was given (the twin, when
// it came with one), so it can name any file. The `bytes` fields are empty
// for UTF-8 names.
// ---------------------------------------------------------------------------

// What is in a directory. Answered with FsEntries.
message FsList {
  uint64 request_id = 1;
  string path = 2;
  // `path` as raw bytes, for a name that is not UTF-8 (see above).
  bytes path_bytes = 3;
}

// One entry, not followed if it is a symbolic link. Answered with FsInfo.
message FsStat {
  uint64 request_id = 1;
  string path = 2;
  // `path` as raw bytes, for a name that is not UTF-8 (see above).
  bytes path_bytes = 3;
}

// The content of a file, or a part of it. Answered with FsData chunks.
message FsRead {
  uint64 request_id = 1;
  string path = 2;
  // Where to start, in bytes.
  uint64 offset = 3;
  // How much to read; 0 = to the end. A read of more than
  // HelloAck.fs_max_bytes is refused: a larger file is read in parts.
  uint64 length = 4;
  // `path` as raw bytes, for a name that is not UTF-8 (see above).
  bytes path_bytes = 5;
}

// Replace the content of a file. Answered with one FsAck, after the last
// chunk or as soon as the write is refused; the rest of a refused write is
// ignored.
//
// Content goes up in chunks sharing one `transfer_id`, as ClipboardPut's.
// The file changes only once the chunk with `last` arrived and everything
// announced was received: the server writes a temporary file next to it and
// renames it over, so a reader never sees half of it, and a write that breaks
// off leaves the file as it was. A symbolic link is written through.
message FsWrite {
  // The same on every chunk of the transfer.
  uint64 request_id = 1;
  // Chosen by the client, distinct from its other transfers in progress.
  uint64 transfer_id = 2;
  // First chunk only, as are `total_size`, `create` and `truncate`.
  string path = 3;
  // Size of the whole content in bytes. The server refuses more than
  // HelloAck.fs_max_bytes.
  uint64 total_size = 4;
  // The file may be missing and is created (mode 0666 less the umask).
  bool create = 5;
  // The file may exist and its content is replaced. `create` without
  // `truncate` makes a new file only; `truncate` without `create` replaces
  // the content of one that exists. Neither: refused.
  bool truncate = 6;
  bytes data = 7;
  bool last = 8;
  // `path` as raw bytes, for a name that is not UTF-8 (see above). First
  // chunk only.
  bytes path_bytes = 9;
}

// Make a directory; its parent must exist. Answered with FsAck.
message FsMkdir {
  uint64 request_id = 1;
  string path = 2;
  // `path` as raw bytes, for a name that is not UTF-8 (see above).
  bytes path_bytes = 3;
}

// Move or rename an entry; `to` must not exist. Answered with FsAck.
message FsRename {
  uint64 request_id = 1;
  string from = 2;
  string to = 3;
  // `from` and `to` as raw bytes, for names that are not UTF-8 (see above);
  // each one on its own.
  bytes from_bytes = 4;
  bytes to_bytes = 5;
}

// Remove a file, a symbolic link (not what it points to) or a directory.
// Answered with FsAck.
message FsDelete {
  uint64 request_id = 1;
  string path = 2;
  // A directory goes with everything in it. Without: only an empty one.
  bool recursive = 3;
  // `path` as raw bytes, for a name that is not UTF-8 (see above).
  bytes path_bytes = 4;
}

// Hear about changes to the entries of a directory (not of its
// subdirectories): FsChanged is pushed for each, until FsUnwatch or the end
// of the connection. Answered with FsAck once the server is watching.
message FsWatch {
  uint64 request_id = 1;
  string path = 2;
  // `path` as raw bytes, for a name that is not UTF-8 (see above).
  bytes path_bytes = 3;
}

// Stop watching a directory, named as in its FsWatch. Answered with FsAck.
message FsUnwatch {
  uint64 request_id = 1;
  string path = 2;
  // `path` as raw bytes, for a name that is not UTF-8 (see above).
  bytes path_bytes = 3;
}

// ---------------------------------------------------------------------------
// Streams: a byte stream a program on the server's machine opens towards the
// client, the server carrying the bytes and nothing else. Opened by the
// server (StreamOpen); StreamData and StreamClose go both ways.
//
// The one kind so far is "ssh-agent" (feature "agent"), forwarding as
// `ssh -A` does: every pane has SSH_AUTH_SOCK pointing at a socket of the
// server's, and a program that connects to it gets a stream to the client
// that subscribed to the pane last among those with "agent" in their
// Hello.features. The client connects the stream to the user's agent. With
// no such client attached, the program's connection is closed at once, as
// if there were no agent.
// ---------------------------------------------------------------------------

// Bytes of an open stream, in order; at most 64 KiB in one message. Data for
// a stream the sender does not know, or that is not the client's, is
// ignored.
message StreamData {
  uint64 stream_id = 1;
  bytes data = 2;
}

// The stream is over: the program closed its connection (server -> client),
// or the client is done with it (client -> server), after which the
// program reads end of file. Not answered. A stream also ends with the
// connection of its client.
message StreamClose {
  uint64 stream_id = 1;
}

// ---------------------------------------------------------------------------
// Exec: run a program on the server's machine without a pane or a shell, its
// stdout and stderr apart, and hear how it ended (feature "exec").
//
// ExecStart is answered with ExecStarted: the exec's id, or why it did not
// start. Then come ExecOutput, in order per stream, and last ExecExit. Output
// and the exit go as data in quantity (see the WebSocket pings above): a
// client that takes them slowly holds the program up, which blocks on
// writing, rather than the server's memory growing.
//
// The program runs in a process group of its own and nothing of it outlives
// the exec: when it exits, whatever is left in its group is killed
// (SIGKILL), and so is the whole group on a time limit, ExecCancel, the end
// of the client's connection, and a reload or stop of the server. Execs are
// not panes: they do not survive a reload, and a client sees them end with
// ExecExit.reason "reload" if its connection lets it.
// ---------------------------------------------------------------------------

// Start a program. Answered with ExecStarted.
message ExecStart {
  // Echoed in ExecStarted.
  uint64 request_id = 1;
  // The program and its arguments, as they are: no shell, nothing expanded.
  // argv[0] is looked up in the server's PATH unless it has a "/".
  repeated string argv = 2;
  // Directory to run in; it must exist. Empty = the home directory.
  string cwd = 3;
  // "NAME=value", added to the server's environment.
  repeated string env = 4;
  // The program's stdin is fed by ExecInput. Without, it reads end of file.
  bool stdin = 5;
  // The program and its process group are killed (SIGKILL) after this long,
  // and its ExecExit says timed_out. 0 = no limit.
  uint32 timeout_ms = 6;
  // A server command: `argv` are arguments of the server's own executable
  // (`token`, `cloud login`, `update`), run as a child of the server, in its
  // environment, as `tilr token` and the like do. Taken on the Unix socket
  // only (refused on TCP), whether or not the "exec" feature is on.
  bool server_command = 7;
}

// Bytes for the program's stdin, of an exec started with `stdin`; `eof`
// closes it after them. A client keeps at most 4 MiB of stdin sent but not
// yet taken by the program, as ExecInputAck tells; an exec whose client
// sends more is killed (ExecExit.reason "input overrun"). Input after `eof`,
// and for an exec that is not the client's, is ignored.
message ExecInput {
  uint64 exec_id = 1;
  bytes data = 2;
  bool eof = 3;
}

// Send a signal (its number: 2 SIGINT, 15 SIGTERM, ...) to the program's
// process group, as a terminal does for Ctrl+C. Not answered.
message ExecSignal {
  uint64 exec_id = 1;
  int32 signal = 2;
}

// The client no longer wants the program: it and its process group are
// killed at once (SIGKILL), and ExecExit says cancelled.
message ExecCancel {
  uint64 exec_id = 1;
}

// ---------------------------------------------------------------------------
// Server -> client
// ---------------------------------------------------------------------------

message ServerMessage {
  oneof msg {
    HelloAck hello_ack = 1;
    PaneCreated pane_created = 2;
    PaneList pane_list = 3;
    PaneExited pane_exited = 4;
    Frame frame = 5;
    Error error = 6;
    ClipboardAck clipboard_ack = 7;
    Pong pong = 8;
    FsEntries fs_entries = 9;
    FsInfo fs_info = 10;
    FsData fs_data = 11;
    FsAck fs_ack = 12;
    FsChanged fs_changed = 13;
    HostEvent host_event = 14;
    StreamOpen stream_open = 15;
    StreamData stream_data = 16;
    StreamClose stream_close = 17;
    ExecStarted exec_started = 18;
    ExecOutput exec_output = 19;
    ExecExit exec_exit = 20;
    ExecInputAck exec_input_ack = 21;
    ClipboardWrite clipboard_write = 22;
  }
}

message HelloAck {
  uint32 protocol_version = 1;
  string server_version = 2;
  // The capabilities this server can be run without and offers, in this
  // order (what is part of the protocol version, such as Ping, is never
  // listed):
  //   "clipboard" - ClipboardPut, and ClipboardWrite to clients that list
  //                 "clipboard-write" (off with --no-clipboard)
  //   "files" - FsList, FsStat, FsRead, FsWrite, FsMkdir, FsRename, FsDelete,
  //             FsWatch, FsUnwatch (off with --no-files)
  //   "host-events" - HostEvent (when the host-events socket is up)
  //   "agent" - SSH agent forwarding: StreamOpen with kind "ssh-agent",
  //             StreamData, StreamClose (off with --no-agent)
  //   "exec" - ExecStart, ExecInput, ExecSignal, ExecCancel (off with
  //            --no-exec)
  repeated string features = 3;
  // Largest content ClipboardPut accepts. 0 without the "clipboard" feature.
  uint64 clipboard_max_bytes = 4;
  // UUID of this server: made when it first ran on the machine, the same after
  // a restart.
  string server_id = 5;
  // Largest content one FsRead returns or one FsWrite takes. 0 without the
  // "files" feature.
  uint64 fs_max_bytes = 6;
  // What this connection adds to its own input counter to make ClientMessage.seq: the
  // client sends seq = seq_base + n with n = 1, 2, 3, ... Different for every connection
  // the server accepts (a reload of the server included), so the seq in
  // Frame.last_input_seq tells whose input it was: seq_base <= seq < seq_base + 2^32 is
  // this connection's. A client that ignores seq_base (numbering from 1) still gets its
  // seq echoed, but with several clients on a pane, or after it reconnects, it cannot tell
  // its echoes from another connection's. 0 from a server that does not know seq.
  uint64 seq_base = 7;
}

message PaneInfo {
  string pane_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  repeated string command = 4;
  // Window title set by the application in the pane, if any.
  string title = 5;
  // Working directory: the one the pane was started in, replaced by what the
  // shell reports (OSC 7) once it does.
  string cwd = 6;
  // Number of clients currently subscribed to the pane.
  uint32 viewers = 7;
  // Unix time in milliseconds.
  uint64 created_at_ms = 8;
  // Process id of the pane process on the server machine. The shell is its
  // child.
  uint32 pid = 9;
  // The clients subscribed to the pane, one per connection (`viewers` of
  // them), in no particular order.
  repeated Viewer viewed_by = 10;
  // Unix time in milliseconds when a client last subscribed to the pane or
  // sent it input; `created_at_ms` until then. `tilr` attaches to the pane
  // used last. PaneList is not pushed when only this changes.
  uint64 used_at_ms = 11;
}

// A connection watching a pane.
message Viewer {
  // Hello.client_id of the connection; empty if it named none.
  string client_id = 1;
  // Hello.client_name.
  string client_name = 2;
  // Where the connection comes from, as the server sees it: "203.0.113.5:51234".
  string address = 3;
}

message PaneCreated {
  PaneInfo pane = 1;
  uint64 request_id = 2;
}

// Sent in reply to ListPanes, and pushed to every client (with request_id 0)
// whenever a pane appears, goes away or its PaneInfo changes.
message PaneList {
  repeated PaneInfo panes = 1;
  uint64 request_id = 2;
}

message PaneExited {
  string pane_id = 1;
  int32 exit_code = 2;
}

message Error {
  string message = 1;
}

// Outcome of a ClipboardPut transfer: sent once, after the last chunk or as
// soon as the transfer is refused. The rest of a refused transfer is ignored
// and the clipboard stays empty.
message ClipboardAck {
  uint64 transfer_id = 1;
  bool ok = 2;
  // Why the transfer was refused; meant to be shown to the user.
  string error = 3;
}

message Pong {
  uint64 nonce = 1;
}

// --- Files: answers to the Fs* requests, see "Files" above. ---

enum FileKind {
  FILE_KIND_FILE = 0;
  FILE_KIND_DIR = 1;
  FILE_KIND_LINK = 2;
  // A socket, a pipe, a device; or, as a link's `target`, nothing: the link
  // is broken.
  FILE_KIND_OTHER = 3;
}

message FsEntry {
  // The last component of the path.
  string name = 1;
  FileKind kind = 2;
  // In bytes; a link's own.
  uint64 size = 3;
  // Last modification, Unix time in milliseconds.
  uint64 mtime_ms = 4;
  // Permission bits, e.g. 0o644.
  uint32 mode = 5;
  // What the entry is, links followed: for anything but a link, its own kind
  // again; for a link, what it points to: a file, a directory, or
  // FILE_KIND_OTHER (a broken link, or anything else). A link is listed as a
  // link; a request naming it follows it.
  FileKind target = 6;
  // The name's raw bytes when it is not UTF-8, `name` then being for
  // showing only (see "Names that are not UTF-8"). Empty otherwise.
  bytes name_bytes = 7;
}

message FsEntries {
  uint64 request_id = 1;
  // The directory, as an absolute path without links ("~" becomes the home
  // directory): what to show as its location.
  string path = 2;
  // Sorted by name.
  repeated FsEntry entries = 3;
  string error = 4;
  // `path` as raw bytes when it is not UTF-8.
  bytes path_bytes = 5;
}

message FsInfo {
  uint64 request_id = 1;
  // As in FsEntries: absolute, the directories on the way without links.
  string path = 2;
  FsEntry entry = 3;
  string error = 4;
  // `path` as raw bytes when it is not UTF-8.
  bytes path_bytes = 5;
}

// Part of a file, in answer to FsRead. Chunks come in order, the last one
// with `last`. A read that fails ends with a chunk that has `last` and
// `error`, and what came before it is void.
message FsData {
  uint64 request_id = 1;
  // Bytes the whole answer carries.
  uint64 total_size = 2;
  bytes data = 3;
  bool last = 4;
  string error = 5;
  // Size of the file.
  uint64 file_size = 6;
}

// Outcome of FsWrite, FsMkdir, FsRename, FsDelete, FsWatch, FsUnwatch.
message FsAck {
  uint64 request_id = 1;
  // Empty = done.
  string error = 2;
}

enum FsChange {
  FS_CHANGE_CREATE = 0;
  FS_CHANGE_MODIFY = 1;
  FS_CHANGE_REMOVE = 2;
}

// Pushed while a directory is watched, a short while after the change (a
// burst of changes to one entry comes as one).
message FsChanged {
  // Always 0: nobody asked.
  uint64 request_id = 1;
  // The directory, as named in FsWatch.
  string watch = 2;
  // What changed: an entry of the directory, absolute and without links, or
  // the directory itself (removed, say).
  string path = 3;
  FsChange kind = 4;
  // `path` as raw bytes when it is not UTF-8.
  bytes path_bytes = 5;
}

// Something a program in a pane asks the client to do: `tilr edit <file>`
// asks to open a file. Sent to every client subscribed to the pane that has
// "host-events" in its Hello.features; with none, the program is told no
// client is attached. The server only carries it; what to do is up to the
// client. Requires the "host-events" feature (HelloAck.features).
message HostEvent {
  // The pane the program runs in.
  string pane_id = 1;
  // What is asked: "open".
  string name = 2;
  // What it is about: "file" (`path` is an absolute path on the server's
  // machine), "url" (`path` is the URL), or another kind the program names.
  string kind = 3;
  string path = 4;
  // Anything else the program gave.
  repeated string args = 5;
}

// A program in a pane copied to the clipboard (OSC 52 or OSC 1337 Copy in its
// output, or the server's `xclip -selection clipboard -i` / `wl-copy`). The
// copy is the server's clipboard from then on, and goes to every client
// subscribed to the pane that has "clipboard-write" in its Hello.features;
// a copy nobody watches for stays on the server and is not sent later. Part
// of the "clipboard" feature (HelloAck.features).
//
// Content comes on the bulk lane in chunks of at most 256 KiB sharing one
// `transfer_id`, `mime` and `total_size`, the last with `last`. A newer copy
// ends a transfer still under way without its `last` chunk: a client drops a
// transfer whose chunks stop coming before `last` once another `transfer_id`
// starts, and takes only a transfer that ends with `last`.
message ClipboardWrite {
  // Chosen by the server, larger than those of its previous transfers. A
  // chunk of a transfer older than the one under way is dropped: a newer
  // copy may overtake the last chunk of the one it ends.
  uint64 transfer_id = 1;
  // The pane the program runs in.
  string pane_id = 2;
  // MIME type of the content: "text/plain;charset=utf-8" for OSC 52.
  string mime = 3;
  // Size of the whole content in bytes.
  uint64 total_size = 4;
  bytes data = 5;
  bool last = 6;
}

// A program connected to the server for a stream to this client; see
// "Streams" above. StreamData follows, both ways, until a StreamClose.
message StreamOpen {
  // Chosen by the server, never used again while it runs.
  uint64 stream_id = 1;
  // What the stream is: "ssh-agent", the SSH agent protocol.
  string kind = 2;
  // The pane whose socket the program connected to.
  string pane_id = 3;
}

// Answer to ExecStart.
message ExecStarted {
  uint64 request_id = 1;
  // Chosen by the server, never used again while it runs.
  uint64 exec_id = 2;
  // Of the program on the server's machine; the id of its process group too.
  uint32 pid = 3;
  // Why it did not start (no such program, no such directory, too many
  // execs); then `exec_id` is 0 and nothing else comes.
  string error = 4;
}

// Output of a program, at most 64 KiB in one message, in order per stream.
message ExecOutput {
  uint64 exec_id = 1;
  // 1 stdout, 2 stderr.
  uint32 stream = 2;
  bytes data = 3;
}

// How much of its stdin the program has taken: `taken` bytes in all, of the
// ExecInput data sent for it. Sent as it takes them.
message ExecInputAck {
  uint64 exec_id = 1;
  uint64 taken = 2;
}

// The program ended, and its output did; the last message of an exec.
message ExecExit {
  uint64 exec_id = 1;
  // Its exit status, if it exited; 0 if a signal killed it.
  int32 code = 2;
  // The signal that killed it, 0 if none.
  int32 signal = 3;
  // Killed for its time limit (ExecStart.timeout_ms).
  bool timed_out = 4;
  // Killed for ExecCancel.
  bool cancelled = 5;
  // Why the server killed it on its own: "reload", "shutdown", "input
  // overrun". Empty otherwise.
  string reason = 6;
}

// Absent Color = terminal default.
message Color {
  oneof value {
    uint32 palette = 1;
    // 0xRRGGBB
    fixed32 rgb = 2;
  }
}

enum Underline {
  UNDERLINE_NONE = 0;
  UNDERLINE_SINGLE = 1;
  UNDERLINE_DOUBLE = 2;
  UNDERLINE_CURLY = 3;
  UNDERLINE_DOTTED = 4;
  UNDERLINE_DASHED = 5;
}

message Style {
  Color fg = 1;
  Color bg = 2;
  Color underline_color = 3;
  // 1 bold, 2 italic, 4 faint, 8 blink, 16 inverse, 32 invisible,
  // 64 strikethrough, 128 overline
  uint32 attrs = 4;
  Underline underline = 5;
}

// A stretch of consecutive cells sharing one style.
message Run {
  // Index into Frame.styles plus one; 0 = default style.
  uint32 style = 1;
  // Unless `cluster` is set: one codepoint per cell.
  // With `cluster`: the whole text is one cell (multi-codepoint grapheme).
  string text = 2;
  // Every cell of this run is two columns wide.
  bool wide = 3;
  bool cluster = 4;
}

// Replaces viewport row `y` entirely. Columns past the last run are blank.
message Row {
  uint32 y = 1;
  repeated Run runs = 2;
}

enum CursorShape {
  CURSOR_SHAPE_BLOCK = 0;
  CURSOR_SHAPE_BAR = 1;
  CURSOR_SHAPE_UNDERLINE = 2;
  CURSOR_SHAPE_BLOCK_HOLLOW = 3;
}

message Cursor {
  bool visible = 1;
  uint32 x = 2;
  uint32 y = 3;
  CursorShape shape = 4;
  bool blinking = 5;
}

// Screen update for one pane. `full` frames carry every row and reset the
// client's copy; otherwise only changed rows are present.
//
// A client that falls behind (what is queued for it waited too long for its
// connection) is not sent every frame: the server skips its frames of the
// pane and, once its connection has caught up, sends it a full frame of the
// screen as it is then. `seq` then jumps. Its own input echoed only in the
// frames it missed is carried by that full frame's `last_input_seq`, so every
// input of a client still gets a frame that echoes it.
message Frame {
  string pane_id = 1;
  uint64 seq = 2;
  bool full = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  repeated Style styles = 6;
  repeated Row changed = 7;
  Cursor cursor = 8;
  // Present only when the title changed (always on full frames).
  optional string title = 9;
  // The application in the pane wants mouse events.
  bool mouse_tracking = 10;
  bool alt_screen = 11;
  // Kitty graphics. Set when the placements in view changed (an image shown or deleted, a
  // scroll, a resize) and on every full frame; `placements` is then the complete list, and
  // unset means the last list still holds.
  bool placements_changed = 12;
  repeated Placement placements = 13;
  // The images the placements use: each sent once per (id, generation) to this pane's
  // subscribers, and all of those in view again on a full frame.
  repeated Image images = 14;
  // The cell the placements are measured in (the last Resize's, or 10x20).
  uint32 cell_width_px = 15;
  uint32 cell_height_px = 16;
  // Rows of history above the viewport's first row: 0 when the pane has no history,
  // growing by one per line that scrolls off while the view is at the live bottom, fixed
  // while the view is scrolled back (new output does not move it). A client that keeps
  // something at a row of the screen (a selection) moves it by the change between frames.
  uint32 viewport_top = 17;
  // The ClientMessage.seq of the input message the pane credited last before this frame was
  // built, from whichever client it came; 0 while there is none. Key, Mouse, Paste and Raw
  // input is credited once the pty has taken its last byte, in the order it arrived; Scroll
  // and Resize when applied, at once (ahead of key input still waiting for the pty). It is
  // the latest, not the highest: it can go down when another client's input comes after.
  // Inputs credited between two frames show only the last of them, so a client takes a
  // frame carrying a later seq of its own (from the same seq_base) as the echo of the
  // earlier ones too (a Scroll or Resize may have overtaken key input still pending).
  // Every credited input gets a frame: when it changed nothing on the screen, a frame
  // with no rows (see below); input without a seq makes no frame of its own. A client
  // measures input latency from sending a message to the first frame that carries its
  // seq, on its own clock.
  //
  // A frame for input that changed nothing: `full` false, no `changed` rows, no `styles`,
  // no `title`, `placements_changed` false, no `images`; `cols`, `rows`, `cursor`,
  // `mouse_tracking`, `alt_screen`, the cell size and `viewport_top` as in the previous
  // frame. It is a frame like any other (its own `seq`); applying it changes nothing.
  uint64 last_input_seq = 18;
  // How the pane produced this frame, for performance measurement. Always present.
  FrameTiming timing = 19;
}

// Timing of one frame's production inside the pane process. Durations are in microseconds,
// on the pane's own clock (no clock sync with the client is needed); a duration too long for
// the field is u32::MAX.
message FrameTiming {
  // From the first pty output after the previous frame to the start of this frame's build:
  // coalescing (output arriving faster than a frame per 8 ms waits) and scheduling. 0 for a
  // frame not caused by output (a subscribe, a resize, a scroll). Output that changed
  // nothing on the screen makes no frame; it counts here (and in output_bytes) for the
  // frame that comes next, however much later.
  uint32 wait_us = 1;
  // Time spent feeding pty output into the screen model since the previous frame, summed.
  uint32 parse_us = 2;
  // Turning the screen model into this frame: diffing rows and building the message.
  uint32 build_us = 3;
  // Protobuf encoding and zstd compression of the previous frame from this pane (this
  // frame's own is not known until it is encoded); 0 on a pane's first frame.
  uint32 encode_us = 4;
  // Pty output consumed since the previous frame: bytes, and read() calls that returned
  // them.
  uint32 output_bytes = 5;
  uint32 reads = 6;
  // For the input named by Frame.last_input_seq, if it is new since the previous frame:
  // from the pane process receiving it to the pty write that took its last byte returning
  // (for Scroll and Resize: to it being applied). 0 when no new input. An input left
  // pending across a reload of the server counts from when the old pane process got it.
  uint32 input_us = 7;
}
// One image shown on the screen, as cells of the viewport.
message Placement {
  uint32 image_id = 1;
  uint64 image_generation = 2;
  // The top-left cell; the row is negative when the top is scrolled out of view.
  int32 col = 3;
  int32 row = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // The part of the image shown, in image pixels (the whole image unless the program cropped).
  uint32 source_x = 7;
  uint32 source_y = 8;
  uint32 source_width = 9;
  uint32 source_height = 10;
  // Offset of the top-left within its cell, in pixels of the frame's cell.
  uint32 x_offset = 11;
  uint32 y_offset = 12;
  // Stacking: negative is under the text, zero and up above it.
  int32 z = 13;
  // The size to draw at, in pixels of the frame's cell (pixel_width / cell_width_px columns by
  // pixel_height / cell_height_px rows from the top-left cell plus the offset); `cols` and
  // `rows` are the cells it covers.
  uint32 pixel_width = 14;
  uint32 pixel_height = 15;
}
// An image a program sent over the Kitty graphics protocol, re-encoded as PNG.
message Image {
  uint32 id = 1;
  // Changes when the program sends the image again under the same id.
  uint64 generation = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes png = 5;
}

// ---------------------------------------------------------------------------
// Internal: pane process -> supervisor
// ---------------------------------------------------------------------------

message PaneStatus {
  string title = 1;
  string cwd = 2;
}

// ---------------------------------------------------------------------------
// Internal: supervisor -> the supervisor that replaces it on reload
// ---------------------------------------------------------------------------

message SupervisorState {
  // Descriptor of the listening TCP socket; -1 for a server that listens on
  // its Unix socket only (an executable that cannot take that over is not
  // reloaded into, see `tilrd state-formats`).
  int32 listener = 1;
  reserved 2;
  repeated PaneState panes = 3;
  // Version of this message's layout and meaning. A supervisor only hands
  // over to an executable that reads the version it writes. 0 = written
  // before versions were recorded, same as 1; 1 named panes by number.
  uint32 format = 4;
  // The id the next connection gets, so ids (and HelloAck.seq_base) are not
  // given out twice across a reload. 0 = not recorded: start from 1.
  uint64 next_client_id = 5;
  // The Unix socket for local clients (see tilr_proto::local), if the
  // server serves one: the listening socket, the lock file held for it, and
  // its path. Unset: the successor sets one up as a server starting does.
  optional int32 local_listener = 6;
  optional int32 local_lock = 7;
  string local_path = 8;
  // The last ClipboardWrite.transfer_id given out, so ids only grow across
  // a reload. 0 = not recorded.
  uint64 last_copy_id = 9;
}

message PaneState {
  PaneInfo info = 1;
  uint32 pid = 2;
  // Descriptors of the pipes to the pane process's stdin and from its stdout.
  int32 to_pane = 3;
  int32 from_pane = 4;
  // Bytes already read from `from_pane` that do not yet make a whole packet.
  bytes unparsed = 5;
}

// ---------------------------------------------------------------------------
// Internal: pane process -> the pane process that replaces it on reload
// ---------------------------------------------------------------------------

// Written to a file named after the pane, which the successor finds by the
// id it was started with.
message PaneHandover {
  // Version of this message's layout and meaning, as in SupervisorState.
  uint32 format = 1;
  // Descriptor of the pty master.
  int32 master = 2;
  uint32 shell_pid = 3;
  // Number of the last frame sent.
  uint64 seq = 4;
  // Rows the viewport was scrolled back into history.
  uint32 scrolled_back = 5;
  uint32 cols = 6;
  uint32 rows = 7;
  // Input not yet written to the pty.
  bytes pending_input = 8;
  // The screen, as the screen model saves it.
  bytes snapshot = 9;
  // The cell in pixels the pane was last resized to (0 = the default).
  uint32 cell_width_px = 10;
  uint32 cell_height_px = 11;
  // Frame.last_input_seq so far.
  uint64 last_input_seq = 12;
  // Named input not yet credited, oldest first.
  repeated PendingInput pending_inputs = 13;
  // Milliseconds left until the process groups being ended after a
  // ClosePane are killed (0 = none: no deadline armed).
  uint32 kill_in_ms = 14;
  // Those process groups: the shell's and the pty's foreground one, hung up
  // already (empty = none).
  repeated uint32 kill_pgids = 15;
}

// An input message named by ClientMessage.seq whose bytes are not all
// written to the pty yet.
message PendingInput {
  uint64 seq = 1;
  // Credited once this many bytes of PaneHandover.pending_input are written.
  uint64 end = 2;
  // Microseconds since the pane process received it.
  uint64 age_us = 3;
}
