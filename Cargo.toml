[workspace]
resolver = "3"
members = ["crates/tilr-proto", "crates/tilr-screen", "crates/tilr-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tilr-proto = { path = "crates/tilr-proto" }
tilr-screen = { path = "crates/tilr-screen" }
anyhow = "1"
bytes = "1"
prost = "0.14"
prost-build = "0.14"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
