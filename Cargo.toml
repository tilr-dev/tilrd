[workspace]
resolver = "3"
members = ["crates/tilr", "crates/tilr-driver", "crates/tilr-proto", "crates/tilr-screen", "crates/tilrd", "crates/tilr-websocket"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# libghostty-vt 0.2.2 requires 1.90 (checked with `cargo +1.90 check --workspace --all-targets`;
# 1.89 fails). Keep in sync with the msrv job in .github/workflows/ci.yml.
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tilr-dev/tilrd"

[workspace.dependencies]
tilr-websocket = { path = "crates/tilr-websocket" }
tilr-proto = { path = "crates/tilr-proto" }
tilr-screen = { path = "crates/tilr-screen" }
anyhow = "1"
bytes = "1"
prost = "0.14"
prost-build = "0.14"
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1

# libghostty-vt-sys builds Ghostty with zig in Debug mode whenever cargo's DEBUG is set, and
# Debug turns on page integrity checks on every scrolled line (~1.5 ms each: a full-screen
# `ls` takes a second). No debuginfo for that one crate makes it ReleaseFast in dev builds too.
[profile.dev.package.libghostty-vt-sys]
debug = false

# The real-reload update test in tilrd and the update test in tilr's client tests gzip the
# real debug tilrd binary (~36 MB) into a fake release, and the tilrd under test gunzips it.
# Unoptimized, flate2/miniz_oxide/crc32fast take seconds per pass; optimize just these crates.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
