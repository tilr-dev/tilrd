# cargo-deny (CI job `cargo-deny`): RustSec advisories, the license allowlist, duplicate crates
# and dependency sources, for the whole workspace (the `failpoints` test feature included).
[graph]
all-features = true

[advisories]
# Every advisory (vulnerability, unmaintained, unsound, notice) fails; yanked versions too.
yanked = "deny"
ignore = [
    # crypto-bigint 0.5 (non-constant-time arithmetic) comes only through p256 in biscuit-auth
    # 6.0.0, which cannot be built without it. tilrd mints and signs with Ed25519 only; P-256
    # code runs at most to verify a holder's public signature on an appended block, on public
    # values, so no secret goes through it. Drop with biscuit-auth 7 (crypto-bigint 0.7).
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via biscuit-auth 6's p256; no secret goes through P-256 in tilrd (bus rights sign with Ed25519)" },
    # proc-macro-error2 (unmaintained, no successor release) is a build-time dependency of the
    # proc macro biscuit-quote, which biscuit-auth 6.0.0 needs to build at all (its
    # `datalog-macro` feature); nothing of it is in tilrd's binary. Drop with biscuit-auth 7.
    { id = "RUSTSEC-2026-0173", reason = "build-time only, via biscuit-quote of biscuit-auth 6.0.0, which does not build without it" },
]

[licenses]
# The licenses the current dependency tree needs (`cargo deny list`). OR-expressions pass
# when one side is allowed, so e.g. "LGPL-3.0-or-later OR MPL-2.0" passes via MPL-2.0.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause", # subtle, zstd-safe, zstd-sys
    "CC0-1.0", # notify
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla's root certificates as data)
    "ISC", # ring, rustls-webpki, untrusted, inotify, inotify-sys
    "Unicode-3.0", # unicode-ident
    "Zlib", # foldhash
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (`tilr-proto = { path = ... }` in [workspace.dependencies])
# have no version; they never reach crates.io (every crate here is publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
