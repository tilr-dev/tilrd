version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns:
          - '*'
  # Actions are pinned by commit SHA; Dependabot moves the SHA and its version comment.
  # Tools downloaded by URL + SHA-256 (gitleaks and cargo-deny in the workflows, Zig and
  # protoc in scripts/install-tools.sh) are
  # bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  # The Linux build image (scripts/linux.Dockerfile) is pinned by digest; Dependabot moves
  # the tag and the digest.
  - package-ecosystem: docker
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
