# Releases: release-please keeps a release PR open from the Conventional Commits on main
# (version bump in [workspace.package] of Cargo.toml and in Cargo.lock, CHANGELOG); merging
# it tags vX.Y.Z and creates the GitHub release; `build` and `upload` then attach prebuilt
# `tilr-server` binaries to the release, and `cdn` publishes the Linux ones to the CDN,
# where `tilr-server update` finds them.
# The three crates (tilr-proto, tilr-screen, tilr-server) share the workspace version and
# move together; none is published to crates.io (publish = false), so there is no publish
# job. release-please-config.json uses the `simple` strategy with TOML extra-files: the
# `rust` strategy cannot bump a version inherited from [workspace.package]. The Cargo.lock
# filter reads `@.name.value` because release-please parses TOML into position-tagged
# values (as in tilr-dev/gitpm).
#
# The release-please job acts as the org GitHub App tilr-bot (a short-lived installation token
# from actions/create-github-app-token, scoped to this repository): the release PR is opened by
# tilr-bot, not by the GITHUB_TOKEN, so CI runs on it like on any PR. There is no bypass: the
# release PR goes through the same required checks, and merging it is the release approval.
#
# binaries: `build` compiles `tilr-server` per target with read-only permissions (dependency
# build scripts run there), and `upload` attaches the archives to the tag's GitHub release.
# Only `upload` gets a writable token: the GITHUB_TOKEN with contents: write, for that job
# alone. GITHUB_TOKEN can upload assets to a release created by tilr-bot (release assets are a
# repository permission, not tied to the release's author), so the App's private key is not
# needed here. Asset names: scripts/package.sh.
# The Linux binaries are built as they always were, by scripts/release.sh (Docker,
# scripts/linux.Dockerfile: Debian 12, glibc 2.36+), on a native runner per architecture, so
# the GitHub release and the CDN carry the same files. macOS builds natively (arm64) and
# cross-compiles x86_64 on the same runner.
#
# cdn: uploads what the Linux builds laid out in dist/cdn to the R2 bucket tilr-cdn with
# `scripts/release.sh --upload-only` (the same script and layout as a release by hand:
# releases/<platform>/latest, releases/<version>/tilr-server-<platform>[.sha256], versions
# like 0.1.0-26449dd). It runs in the `cdn` environment (restricted to main), which holds
# CLOUDFLARE_API_TOKEN (R2 write access to the bucket's account) and the required
# CLOUDFLARE_ACCOUNT_ID variable (the bucket's account; the job fails without it). It runs
# last, after the GitHub release has its assets: from its last upload on, servers that run
# `tilr-server update` get the new version.

name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read # all writes go through the tilr-bot token below
    # The package is the repository root ("."), so the outputs carry no path prefix.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TILR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TILR_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # the release PR's branch, the tag, the GitHub release
          permission-pull-requests: write # the release PR
          permission-issues: write # release-please's labels on the release PR
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    # Native arm64 macOS runner; x86_64 is cross-compiled there (the macOS SDK has both
    # architectures, and Zig builds libghostty-vt for the target cargo names).
    # Linux: scripts/release.sh in Docker on a runner of the target's architecture, so the
    # container runs natively (no QEMU).
    # aarch64 Linux is off unless the repository variable RELEASE_LINUX_ARM64 is 'true':
    # ubuntu-24.04-arm runners are free only for public repositories. A matrix row cannot
    # carry its own `if`, so the row is appended to the list only when the variable is set.
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}{1}]',
          '{"target":"aarch64-apple-darwin","os":"macos-15","native":true,"platform":""},
          {"target":"x86_64-apple-darwin","os":"macos-15","native":false,"platform":""},
          {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04","native":true,"platform":"linux-x86_64"}',
          vars.RELEASE_LINUX_ARM64 == 'true'
          && ',{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-24.04-arm","native":true,"platform":"linux-aarch64"}'
          || '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install Rust (stable, ${{ matrix.target }})
        if: matrix.platform == ''
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Install Zig and protoc
        if: matrix.platform == ''
        run: |
          scripts/install-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      # No cache: a release build starts clean.
      - name: Build (macOS)
        if: matrix.platform == ''
        run: |
          cargo build --release --locked -p tilr-server --target "$TARGET"
          echo "BINARY=target/$TARGET/release/tilr-server" >> "$GITHUB_ENV"
      # The CDN layout (dist/cdn) and dist/tilr-server-<platform>, as by hand.
      - name: Build (Linux, scripts/release.sh)
        if: matrix.platform != ''
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          scripts/release.sh "$PLATFORM"
          echo "BINARY=dist/tilr-server-$PLATFORM" >> "$GITHUB_ENV"
      # The binary names the version it was built as: the tag's version and the commit.
      - name: Check the version
        if: matrix.native
        run: |
          case "$("$BINARY" --version)" in
            "tilr-server ${TAG#v}-$(git rev-parse --short HEAD) ("*")") ;;
            *) "$BINARY" --version; exit 1 ;;
          esac
      - run: scripts/package.sh "$TAG" "$TARGET" "$BINARY" dist/github
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tilr-server-${{ matrix.target }}
          path: dist/github/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform != ''
        with:
          name: cdn-${{ matrix.platform }}
          path: dist/cdn/
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload; nothing else in this job runs repository code
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tilr-server-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      # --clobber: a re-run replaces the assets of a failed or partial upload.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  cdn:
    needs: [release-please, upload]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cdn
    permissions:
      contents: read
    # The Linux platforms the build job built; with aarch64 off its CDN `latest` is left as
    # it is.
    env:
      PLATFORMS: ${{ vars.RELEASE_LINUX_ARM64 == 'true' && 'linux-aarch64 linux-x86_64' || 'linux-x86_64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cdn-*
          path: dist/cdn
          merge-multiple: true
      # Every platform built must carry this tag's version (the tag's version plus the commit).
      - name: Check the version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          want="${TAG#v}-$(git rev-parse --short HEAD)"
          for platform in $PLATFORMS; do
            test "$(cat "dist/cdn/releases/$platform/latest")" = "$want"
          done
      # wrangler is the tool scripts/release.sh uploads with; pinned by version (npm checks
      # the package's integrity against the registry).
      - name: Install wrangler
        run: npm install --global --no-fund --no-audit "wrangler@${WRANGLER_VERSION}"
        env:
          WRANGLER_VERSION: 4.151.1
      - name: Upload to the CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?set the CLOUDFLARE_ACCOUNT_ID variable of the cdn environment}"
          # shellcheck disable=SC2086 # PLATFORMS is a list of words
          scripts/release.sh --upload-only $PLATFORMS
