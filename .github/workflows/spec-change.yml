name: Specification authorization

on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  spec-change:
    name: spec-change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch specification trees without a checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/spec-inspection.git"
          git -C "$RUNNER_TEMP/spec-inspection.git" remote add origin "https://github.com/$REPOSITORY.git"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          # Compare dev with GitHub's test merge of the PR, not with the branch tip: a branch that
          # is behind dev would otherwise "remove" every requirement dev gained after it forked.
          if ! git -C "$RUNNER_TEMP/spec-inspection.git" fetch --no-tags --depth=2 origin \
            "refs/pull/$PR_NUMBER/merge:refs/inspection/merge"; then
            echo "spec-change: no merge result for this PR (conflict with dev?); resolve it and push again" >&2
            exit 1
          fi
          parents=$(git -C "$RUNNER_TEMP/spec-inspection.git" cat-file -p refs/inspection/merge | sed -n 's/^parent //p')
          merged_base=$(sed -n 1p <<<"$parents")
          merged_head=$(sed -n 2p <<<"$parents")
          if [ "$merged_head" != "$HEAD_SHA" ]; then
            echo "spec-change: GitHub has not updated the merge result for $HEAD_SHA yet; re-run the job" >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/spec-inspection.git" update-ref refs/inspection/base "$merged_base"
      - name: Download the content-pinned shared checker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tilr-dev/gitpm/main/scripts/spec_change.py \
            --output "$RUNNER_TEMP/spec_change.py"
          printf '272e194c2180cbc262a4cf6f34848d898afbc0325ed05a3d697f5b40a1bcd797  %s\n' "$RUNNER_TEMP/spec_change.py" | sha256sum --check --strict
      - name: Authorize specification changes
        env:
          ITSAPLAN_READ_ONLY_TOKEN: ${{ secrets.ITSAPLAN_READ_ONLY_TOKEN }}
          TASK_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/spec_change.py" \
            --repo "$RUNNER_TEMP/spec-inspection.git" \
            --component tilrd \
            --base refs/inspection/base --head refs/inspection/merge \
            --branch "$TASK_BRANCH"
