name: Specification authorization

on:
  merge_group:
    types: [checks_requested]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

# The shared scripts come from a fixed gitpm commit, each checked against its digest: a change
# to them in gitpm takes effect here only through a pull request into main that moves the pin.
permissions:
  contents: read
  pull-requests: read # spec_merge.py reads the pull request's mergeable state

jobs:
  spec-change:
    name: spec-change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report merge queue authorization
        if: github.event_name == 'merge_group'
        shell: bash
        run: echo "Queued pull requests already passed specification authorization."
      - name: Fetch specification trees without a checkout
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/spec-inspection.git"
          git -C "$RUNNER_TEMP/spec-inspection.git" remote add origin "https://github.com/$REPOSITORY.git"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          # Compare main with GitHub's test merge of the PR, not with the branch tip: a branch that
          # is behind main would otherwise "remove" every requirement main gained after it forked.
          # The helper tells a conflict with main from a merge result GitHub has not updated yet,
          # and fetches refs/inspection/base and refs/inspection/merge.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tilr-dev/gitpm/dd6fde0efc2fbc54ab5ae0eab654cde3a58d24f9/scripts/spec_merge.py \
            --output "$RUNNER_TEMP/spec_merge.py"
          printf 'fb9bc7642bf8483c658bbd04c06ba6b0816d5feb51ebf81a392803ba8f8fab5b  %s\n' "$RUNNER_TEMP/spec_merge.py" | sha256sum --check --strict
          python3 "$RUNNER_TEMP/spec_merge.py" \
            --repo "$RUNNER_TEMP/spec-inspection.git" \
            --repository "$REPOSITORY" --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --branch "$TASK_BRANCH"
      - name: Download the content-pinned shared checker
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tilr-dev/gitpm/dd6fde0efc2fbc54ab5ae0eab654cde3a58d24f9/scripts/spec_change.py \
            --output "$RUNNER_TEMP/spec_change.py"
          printf '956d89a2a3b8cf102f1c5687b1909656556a8aeb0c2bdf75ddd20e71d8a5255c  %s\n' "$RUNNER_TEMP/spec_change.py" | sha256sum --check --strict
      - name: Authorize specification changes
        if: github.event_name == 'pull_request_target'
        env:
          ITSAPLAN_READ_ONLY_TOKEN: ${{ secrets.ITSAPLAN_READ_ONLY_TOKEN }}
          TASK_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/spec_change.py" \
            --repo "$RUNNER_TEMP/spec-inspection.git" \
            --component tilrd \
            --base refs/inspection/base --head refs/inspection/merge \
            --branch "$TASK_BRANCH"
