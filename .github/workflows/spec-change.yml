name: Specification authorization

on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  spec-change:
    name: spec-change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch specification trees without a checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/spec-inspection.git"
          git -C "$RUNNER_TEMP/spec-inspection.git" remote add origin "https://github.com/$REPOSITORY.git"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -C "$RUNNER_TEMP/spec-inspection.git" fetch --no-tags --depth=1 origin \
            "$BASE_SHA:refs/inspection/base" \
            "refs/pull/$PR_NUMBER/head:refs/inspection/head"
          test "$(git -C "$RUNNER_TEMP/spec-inspection.git" rev-parse refs/inspection/head)" = "$HEAD_SHA"
      - name: Download the content-pinned shared checker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tilr-dev/gitpm/main/scripts/spec_change.py \
            --output "$RUNNER_TEMP/spec_change.py"
          printf '6b366dbce43ae5df3c4f571fb9004f03a944608f6805daf0e98ab75435cc177c  %s\n' "$RUNNER_TEMP/spec_change.py" | sha256sum --check --strict
      - name: Authorize specification changes
        env:
          ITSAPLAN_READ_ONLY_TOKEN: ${{ secrets.ITSAPLAN_READ_ONLY_TOKEN }}
          TASK_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/spec_change.py" \
            --repo "$RUNNER_TEMP/spec-inspection.git" \
            --component tilrd \
            --base refs/inspection/base --head refs/inspection/head \
            --branch "$TASK_BRANCH"
