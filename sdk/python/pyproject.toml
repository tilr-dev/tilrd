[project]
name = "tilr-bus"
version = "0.0.0"
description = "The tilr bus (tilr.bus.v1) for Python: call, provide, emit/on and stream"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = [
    "protobuf==7.36.2",
    "websockets==17.3",
    "zstandard==0.25.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/tilr_bus/proto/_gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# `timeout=` is the call's deadline, sent to the provider (Call.timeout_ms), not only
# a local wait that `asyncio.timeout` could replace.
ignore = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
files = ["src/tilr_bus", "tests"]
# Generated by protoc (scripts/gen-bus-sdk.sh); its .pyi stubs are what is checked against.
exclude = ["src/tilr_bus/proto/_gen/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
