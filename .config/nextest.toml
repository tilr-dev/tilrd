# cargo-nextest configuration (https://nexte.st/docs/configuration/).
#
# `default`: every test; local runs, the merge queue, release branches and the nightly run.
# `quick`: the pull request tier of CI (NEXTEST_PROFILE=quick in .github/workflows/ci.yml):
# every test but the slow ones listed below, each 3 s or more on the Linux runner
# (measured 2026-10-31). They still run before anything reaches `main`: the merge queue runs
# the whole suite on Linux and macOS. A listed name that no longer exists fails
# `release::the_quick_profile_skips_only_existing_tests`.

[profile.quick]
default-filter = '''
not (
    test(=a_client_that_lags_skips_to_the_latest_screen_and_still_gets_its_echo)
  | test(=a_lagging_client_gets_the_last_screen_without_new_output)
  | test(=deploy_reloads_a_server_on_a_custom_socket)
  | test(=deploy_through_a_stub_ssh_installs_both_and_prints_how_to_connect)
  | test(=deploy_does_not_start_a_daemon_before_a_failing_service_install)
  | test(=tilr_update_runs_the_update_in_the_local_server_and_waits_for_the_reload)
  | test(=update_installs_the_latest_release_and_the_running_server_keeps_its_shells)
  | test(=a_cloudflared_ignoring_sigterm_does_not_hold_back_a_reload)
  | test(=a_stuck_pane_does_not_block_other_panes_hello)
  | test(=check_reports_the_configured_release_without_changes)
  | test(=a_cloudflared_that_exits_is_reported_and_started_again)
  | test(=a_client_answering_only_the_latest_ping_gets_the_whole_file)
  | test(=output_printed_during_a_reload_is_not_lost)
  | test(=update_requires_authentic_metadata_before_downloading)
  | test(=a_cloudflared_left_by_a_killed_server_is_stopped)
  | test(=signals_during_restoration_wait_for_the_queued_reload)
  | test(=signals_arriving_while_the_successor_starts_are_held_for_it)
  | test(=a_storm_of_reload_signals_costs_no_shell)
  | test(=a_link_cloud_revokes_stops_the_tunnel_until_linked_again)
  | test(=an_idle_client_that_is_still_there_stays_connected)
  | test(=the_pane_process_title_follows_exec_in_the_same_foreground_group)
)
'''
